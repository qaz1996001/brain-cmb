[project]
name = "brain-cmb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "user", email = "a03440@tmu.edu.tw" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "nibabel>=5.3.2",
    "pandas>=2.3.3",
    "pipelinecore",
    "pydicom>=2.4.3",
    "pydicom-seg>=0.4.1",
    "python-dotenv>=1.2.1",
    "pyyaml==6.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.15.0",
    "tensorflow==2.14.0",
    "nvidia-cudnn-cu11==8.9.2.26",
    "nvidia-nccl-cu11>=2.21.5",
    "nvidia-cuda-cupti-cu11>=11.8.87",
    "nvidia-cuda-nvrtc-cu11>=11.8.89",
    "nvidia-cuda-runtime-cu11>=11.8.89",
    "nvidia-ml-py>=13.590.44",
    "nvidia-nvtx-cu11>=11.8.86",
    "nvidia-cufft-cu11>=10.9.0.58",
    "nvidia-curand-cu11>=10.3.0.86",
    "nvidia-cusolver-cu11>=11.4.1.48",
    "nvidia-cusparse-cu11>=11.7.5.86",
    "nvidia-cuda-nvcc-cu11>=11.8.89",
]

[project.scripts]
brain-cmb = "brain_cmb:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
pipelinecore = { path = "../brain-parcellation-pipeline-timing/pipelinecore", editable = true  }
brain_parcellation = { path = "../brain-parcellation-pipeline-timing", editable = true  }

[tool.ruff.lint.isort]
known-first-party = ["brain_cmb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
# Ignore errors for optional ML dependencies (TensorFlow/PyTorch)
# These are conditionally imported at runtime and may not be installed
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
# External third-party code has complex numpy typing issues
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
# Complex pattern matching in external code
no-matching-overload = "ignore"
# Callable type issues with torch/tf tensors
call-non-callable = "ignore"
# Variance issues with BasePipeline generics
invalid-method-override = "ignore"
# Type narrowing issues with dict lookups and optional returns
invalid-assignment = "ignore"
invalid-return-type = "ignore"
# Unused type: ignore comments from mypy
unused-ignore-comment = "ignore"
